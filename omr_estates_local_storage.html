<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OMR Estates | Find Your Place</title>
<style>
:root{--navy:#14263d;--blue:#254b70;--gold:#d7a85d;--cream:#f7f5f0;--ink:#202b38;--muted:#6b7785;--line:#e5e8ec;--white:#fff;--green:#217a57;--red:#b54444}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--cream);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 15px;font-weight:650}.primary{background:var(--navy);color:white}.gold{background:var(--gold);color:#1c2732}.secondary{background:#edf1f5;color:var(--navy)}.danger{background:#fff0ef;color:var(--red)}.topbar{background:var(--navy);color:white;padding:16px clamp(16px,4vw,54px);display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:0;z-index:5;box-shadow:0 5px 18px #12243a22}.brand{font-size:20px;font-weight:800;letter-spacing:.3px}.brand span{color:var(--gold)}.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.nav button{background:transparent;color:#eaf0f7;padding:9px 12px}.nav button.active,.nav button:hover{background:#ffffff18}.wrap{max-width:1200px;margin:auto;padding:28px 20px 60px}.hero{background:linear-gradient(110deg,#14263ded,#254b70d9),url('https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=1800&q=85') center/cover;border-radius:22px;color:white;padding:clamp(28px,6vw,68px);min-height:300px;display:flex;align-items:center}.hero h1{font-size:clamp(32px,5vw,54px);line-height:1.08;margin:0 0 14px;max-width:650px}.hero p{max-width:600px;color:#e6edf4;line-height:1.7}.hero .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:30px 0 16px}.section-head h2{margin:0;font-size:25px}.muted{color:var(--muted)}.filters{display:grid;grid-template-columns:2fr repeat(3,1fr) auto;gap:10px;background:white;padding:14px;border:1px solid var(--line);border-radius:15px;margin:22px 0}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}.field label{font-size:13px;font-weight:700;color:#425164}.field input,.field select,.field textarea,.filters input,.filters select{width:100%;border:1px solid #dce2e8;border-radius:9px;padding:11px 12px;background:white;color:var(--ink);min-width:0}.field textarea{min-height:90px;resize:vertical}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.property{background:white;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 5px 18px #14263d08}.property img{width:100%;height:205px;object-fit:cover;background:#e7eaf0}.property-body{padding:16px}.property h3{margin:0 0 7px;font-size:19px}.price{font-size:20px;font-weight:800;color:var(--navy)}.tag{display:inline-block;background:#f2eadc;color:#765522;border-radius:20px;padding:5px 9px;font-size:12px;font-weight:750;margin:0 5px 8px 0}.meta{color:var(--muted);font-size:13px;line-height:1.7}.card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.card-actions button{flex:1}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:22px;margin:18px 0;box-shadow:0 5px 18px #14263d06}.panel h2,.panel h3{margin-top:0}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}.full{grid-column:1/-1}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{background:white;border:1px solid var(--line);border-radius:14px;padding:19px}.stat strong{display:block;font-size:29px;color:var(--navy);margin-top:7px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:680px}th,td{text-align:left;padding:13px 11px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}th{color:#526174;font-size:12px;text-transform:uppercase;letter-spacing:.4px}.status{display:inline-block;padding:5px 9px;border-radius:20px;background:#edf3f8;font-size:12px;font-weight:750}.status.Approved,.status.Available{background:#e5f5ec;color:var(--green)}.status.Cancelled,.status.Rejected{background:#fff0ef;color:var(--red)}.empty{padding:35px;text-align:center;color:var(--muted);background:white;border:1px dashed #ccd3dc;border-radius:14px}.notice{padding:13px 15px;border-radius:10px;background:#eef5fb;color:#254b70;margin:12px 0;font-size:14px}.footer{background:var(--navy);color:#dbe4ee;padding:28px 20px;text-align:center}.footer a{color:#f1c779;text-decoration:none}.hidden{display:none!important}.modal-backdrop{position:fixed;inset:0;background:#0b1726a8;z-index:10;display:flex;align-items:center;justify-content:center;padding:18px}.modal{background:white;border-radius:18px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:24px}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.close{font-size:24px;background:#edf1f5;padding:5px 11px}.toast{position:fixed;bottom:22px;right:22px;background:#172a40;color:white;padding:13px 18px;border-radius:10px;box-shadow:0 8px 25px #0003;z-index:20}.small{font-size:12px}.pill-row{display:flex;gap:7px;flex-wrap:wrap}.checkbox-line{display:flex;align-items:center;gap:8px;margin:8px 0}.checkbox-line input{width:auto}.login-box{max-width:470px;margin:30px auto}.image-fallback{display:grid;place-items:center;background:#e9edf2;color:#64748b;height:205px}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.filters{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,1fr)}.topbar{align-items:flex-start;flex-direction:column}.nav{width:100%}}
@media(max-width:560px){.grid,.form-grid,.stats,.filters{grid-template-columns:1fr}.full{grid-column:auto}.wrap{padding:18px 13px 40px}.hero{min-height:280px}.section-head{align-items:flex-start;flex-direction:column}.panel{padding:16px}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">OMR <span>ESTATES</span></div>
  <nav class="nav" id="nav"></nav>
</header>
<main class="wrap" id="app"></main>
<footer class="footer">Looking for your next home? Call <a href="tel:9962666063">9962666063</a> for further details.<br><span class="small">OMR Estates · Property listings and visit requests</span></footer>
<div id="modal-root"></div><div id="toast-root"></div>
<script>
const KEY='omrEstates_v1';
const ADMIN_USER='admin', ADMIN_PASS='admin123';
const defaultData={
 properties:[
  {id:'p101',title:'Bright 2 BHK Apartment',type:'2 BHK',kind:'Rent',price:22000,advance:100000,location:'Thoraipakkam, Chennai',address:'Near OMR main road, Thoraipakkam',furnishing:'Semi-furnished',parking:'Bike and car',pets:'Considered',available:'Available',beds:2,baths:2,area:1050,description:'Well-ventilated apartment with lift, security and easy access to OMR offices.',amenities:'Lift, CCTV, Water supply, Balcony',image:'https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=1000&q=80'},
  {id:'p102',title:'Studio Home Near IT Park',type:'1 RK/Studio',kind:'Rent',price:12000,advance:50000,location:'Perungudi, Chennai',address:'Residential street near Perungudi MRTS',furnishing:'Furnished',parking:'Bike only',pets:'No pets',available:'Available',beds:1,baths:1,area:450,description:'Compact furnished studio suitable for a single occupant, close to transport and shops.',amenities:'Wardrobe, Fridge, Wi-Fi provision',image:'https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?auto=format&fit=crop&w=1000&q=80'},
  {id:'p103',title:'Spacious 3 BHK Family Flat',type:'3 BHK',kind:'Rent',price:35000,advance:200000,location:'Sholinganallur, Chennai',address:'Gated community near ECR link road',furnishing:'Unfurnished',parking:'Car and bike',pets:'Allowed',available:'Available',beds:3,baths:3,area:1500,description:'Spacious family home in a gated community with practical amenities and good connectivity.',amenities:'Security, Play area, Lift, Covered parking',image:'https://images.unsplash.com/photo-1600566753086-00f18fb6b3ea?auto=format&fit=crop&w=1000&q=80'}
 ],
 requirements:[], bookings:[], favorites:[], currentUser:null
};
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));return d?{...structuredClone(defaultData),...d}:structuredClone(defaultData)}catch(e){return structuredClone(defaultData)}}
let db=load(), page='home', editingId=null;
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return '₹'+Number(n||0).toLocaleString('en-IN')}
function toast(msg){const el=document.getElementById('toast-root');el.innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>el.innerHTML='',2800)}
function nav(){const n=document.getElementById('nav');let links=[['home','Home'],['properties','Properties'],['requirements','Find My Home'],['mybookings','My Visits']];if(db.currentUser?.role==='admin')links=[['admin','Dashboard'],['properties','Properties'],['requirements','Enquiries'],['mybookings','Visit Bookings']];n.innerHTML=links.map(([id,label])=>`<button class="${page===id?'active':''}" onclick="go('${id}')">${label}</button>`).join('')+(db.currentUser?`<button onclick="logout()">Logout (${esc(db.currentUser.name)})</button>`:`<button onclick="go('login')">Admin Login</button>`)}
function go(p){page=p;render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){nav();const a=document.getElementById('app');if(page==='home')a.innerHTML=home();else if(page==='properties')a.innerHTML=propertiesPage();else if(page==='requirements')a.innerHTML=requirementPage();else if(page==='mybookings')a.innerHTML=bookingsPage();else if(page==='admin')a.innerHTML=adminPage();else if(page==='login')a.innerHTML=loginPage();else a.innerHTML=home()}
function home(){return `<section class="hero"><div><span class="tag">YOUR NEXT CHAPTER STARTS HERE</span><h1>Find a place that feels like home.</h1><p>Explore homes across Chennai, compare rent and advance, and book a convenient time to visit. Tell us what you need and our team can follow up.</p><div class="actions"><button class="gold" onclick="go('properties')">Explore properties</button><button class="secondary" onclick="go('requirements')">Share house requirements</button></div></div></section>
<div class="section-head"><div><h2>Featured properties</h2><p class="muted">A few homes to get your search started.</p></div><button class="secondary" onclick="go('properties')">View all properties →</button></div>
<div class="grid">${db.properties.filter(p=>p.available!=='Rented').slice(0,3).map(propertyCard).join('')||'<div class="empty">No properties listed yet.</div>'}</div>
<div class="panel" style="margin-top:28px"><div class="section-head" style="margin-top:0"><div><h2>Not sure what to choose?</h2><p class="muted">Share your budget, preferred area and move-in timeline.</p></div><button class="primary" onclick="go('requirements')">Tell us what you need</button></div><p class="muted">Questions? Call <a href="tel:9962666063">9962666063</a>.</p></div>`}
function propertyCard(p){return `<article class="property"><img src="${esc(p.image||'')}" alt="${esc(p.title)}" onerror="this.style.display='none';this.nextElementSibling.classList.remove('hidden')"><div class="image-fallback hidden">Property image unavailable</div><div class="property-body"><span class="tag">${esc(p.type)}</span><span class="tag">${esc(p.kind||'Rent')}</span><h3>${esc(p.title)}</h3><div class="price">${money(p.price)}${p.kind==='Sale'?'':' / month'}</div><div class="meta">Advance: <b>${money(p.advance)}</b><br>⌖ ${esc(p.location)}<br>${esc(p.furnishing)} · ${esc(p.parking)}</div><div class="card-actions"><button class="secondary" onclick="details('${p.id}')">Details</button><button class="primary" onclick="bookVisit('${p.id}')">Book a visit</button></div></div></article>`}
function propertiesPage(){return `<div class="section-head"><div><h2>Available properties</h2><p class="muted">Search, compare and request a visit.</p></div>${db.currentUser?.role==='admin'?'<button class="primary" onclick="propertyForm()">+ Add property</button>':''}</div>
<div class="filters"><input id="q" placeholder="Search title or location…" oninput="filterProperties()"><select id="typeFilter" onchange="filterProperties()"><option value="">All house types</option>${['1 RK/Studio','1 BHK','2 BHK','3 BHK','4 BHK+','Any'].map(x=>`<option>${x}</option>`).join('')}</select><select id="budgetFilter" onchange="filterProperties()"><option value="">Any monthly budget</option><option value="15000">Up to ₹15,000</option><option value="25000">Up to ₹25,000</option><option value="40000">Up to ₹40,000</option><option value="60000">Up to ₹60,000</option></select><select id="furnishFilter" onchange="filterProperties()"><option value="">Any furnishing</option><option>Furnished</option><option>Semi-furnished</option><option>Unfurnished</option></select><button class="secondary" onclick="clearFilters()">Reset</button></div>
<div id="property-results" class="grid">${propertyResults(db.properties)}</div>`}
function propertyResults(list){list=list.filter(p=>p.available==='Available');if(db.currentUser?.role==='admin')list=db.properties;return list.map(p=>propertyCard(p)+(db.currentUser?.role==='admin'?`<div class="card-actions" style="padding:0 16px 16px"><button class="secondary" onclick="propertyForm('${p.id}')">Edit</button><button class="danger" onclick="deleteProperty('${p.id}')">Delete</button><button class="secondary" onclick="cycleStatus('${p.id}')">${esc(p.available||'Available')}</button></div>`:'')).join('')||'<div class="empty">No matching properties found. Try changing your filters or submit your requirements.</div>'}
function filterProperties(){const q=(document.getElementById('q')?.value||'').toLowerCase(),t=document.getElementById('typeFilter')?.value||'',b=Number(document.getElementById('budgetFilter')?.value||0),f=document.getElementById('furnishFilter')?.value||'';const list=db.properties.filter(p=>(!q||(p.title+' '+p.location+' '+p.address).toLowerCase().includes(q))&&(!t||t==='Any'||p.type===t)&&(!b||Number(p.price)<=b)&&(!f||p.furnishing===f));document.getElementById('property-results').innerHTML=propertyResults(list)}
function clearFilters(){['q','typeFilter','budgetFilter','furnishFilter'].forEach(id=>{const e=document.getElementById(id);if(e)e.value=''});filterProperties()}
function details(id){const p=db.properties.find(x=>x.id===id);if(!p)return;document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h2>${esc(p.title)}</h2><button class="close" onclick="closeModal()">×</button></div><img src="${esc(p.image||'')}" style="width:100%;max-height:300px;object-fit:cover;border-radius:12px" onerror="this.style.display='none'"><p class="price">${money(p.price)}${p.kind==='Sale'?'':' / month'}</p><p><b>Advance:</b> ${money(p.advance)} · <b>Type:</b> ${esc(p.type)} · <b>Status:</b> ${esc(p.available)}</p><p><b>Location:</b> ${esc(p.location)}<br><b>Address:</b> ${esc(p.address)}<br><b>Area:</b> ${esc(p.area||'Not specified')} sq.ft · <b>Bedrooms:</b> ${esc(p.beds||'—')} · <b>Bathrooms:</b> ${esc(p.baths||'—')}</p><p><b>Furnishing:</b> ${esc(p.furnishing)} · <b>Parking:</b> ${esc(p.parking)} · <b>Pets:</b> ${esc(p.pets)}</p><p><b>Amenities:</b> ${esc(p.amenities||'Not specified')}</p><p>${esc(p.description||'No additional description.')}</p><div class="card-actions"><button class="primary" onclick="closeModal();bookVisit('${p.id}')">Book a visit</button><a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.address+' '+p.location)}" target="_blank" rel="noopener"><button class="secondary">Open map</button></a></div></div></div>`}
function closeModal(){document.getElementById('modal-root').innerHTML=''}
function bookVisit(id){const p=db.properties.find(x=>x.id===id);if(!p)return;document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h2>Request a property visit</h2><button class="close" onclick="closeModal()">×</button></div><p class="muted">${esc(p.title)} · ${esc(p.location)}</p><form onsubmit="submitBooking(event,'${p.id}')"><div class="form-grid"><div class="field"><label>Full name *</label><input name="name" required maxlength="100"></div><div class="field"><label>Phone number *</label><input name="phone" required type="tel" pattern="[0-9+() -]{8,18}" placeholder="Your contact number"></div><div class="field"><label>Preferred visit date *</label><input name="date" required type="date" min="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Preferred time *</label><select name="time" required><option value="">Select time</option><option>9 AM – 11 AM</option><option>11 AM – 1 PM</option><option>2 PM – 4 PM</option><option>4 PM – 6 PM</option></select></div><div class="field full"><label>Message (optional)</label><textarea name="message" placeholder="Any questions or preferred arrangements?"></textarea></div></div><div class="notice">This creates a visit request. The team will confirm the slot with you.</div><button class="primary" type="submit">Send visit request</button></form></div></div>`}
function submitBooking(e,id){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));db.bookings.unshift({id:'b'+Date.now(),propertyId:id,propertyTitle:db.properties.find(p=>p.id===id)?.title||'Property',...f,status:'Pending',created:new Date().toISOString()});save();closeModal();toast('Visit request submitted');go('mybookings')}
function requirementPage(){return `<div class="section-head"><div><h2>Tell us what home you need</h2><p class="muted">Complete this form and our team can follow up on suitable options.</p></div></div><div class="panel"><form onsubmit="submitRequirement(event)"><div class="form-grid">
<div class="field"><label>Full name *</label><input name="name" required maxlength="100" placeholder="Your full name"></div>
<div class="field"><label>Phone number *</label><input name="phone" type="tel" required pattern="[0-9+() -]{8,18}" placeholder="Mobile number"></div>
<div class="field"><label>Who will be staying? *</label><select name="staying" required><option value="">Select</option><option>Family</option><option>Male bachelors</option><option>Female bachelors</option><option>Unmarried couple</option><option>Friends</option><option>Co-living</option><option>Single occupant</option><option>Other</option></select></div>
<div class="field"><label>Number of occupants *</label><input name="occupants" required type="number" min="1" max="50" placeholder="e.g. 3"></div>
<div class="field"><label>What type of house? *</label><select name="houseType" required><option value="">Select</option><option>1 BHK</option><option>2 BHK</option><option>1 RK/Studio</option><option>3 BHK</option><option>4 BHK+</option><option>Any</option></select></div>
<div class="field"><label>Monthly budget (₹) *</label><select name="budget" required><option value="">Select range</option><option>Below ₹10,000</option><option>₹10,000–₹15,000</option><option>₹15,000–₹25,000</option><option>₹25,000–₹40,000</option><option>₹40,000–₹60,000</option><option>₹60,000+</option><option>Flexible / negotiable</option></select></div>
<div class="field"><label>Preferred location(s) *</label><input name="location" required placeholder="e.g. Sholinganallur, Perungudi"></div>
<div class="field"><label>When do you need the house? *</label><select name="timeline" required><option value="">Select</option><option>Immediately</option><option>Within 15 days</option><option>Within 1 month</option><option>Within 2 months</option><option>After 2 months</option></select></div>
<div class="field"><label>Parking requirement</label><select name="parking"><option>No preference</option><option>Not required</option><option>Bike parking</option><option>Car parking</option><option>Car and bike parking</option></select></div>
<div class="field"><label>Furnishing preference</label><select name="furnishing"><option>No preference</option><option>Furnished</option><option>Semi-furnished</option><option>Unfurnished</option></select></div>
<div class="field"><label>Pets</label><select name="pets"><option>No pets</option><option>Yes, dog</option><option>Yes, cat</option><option>Other pets</option><option>Prefer pet-friendly property</option></select></div>
<div class="field"><label>Rent or purchase?</label><select name="kind"><option>Rent</option><option>Purchase</option><option>Either</option></select></div>
<div class="field"><label>Preferred bathrooms</label><select name="bathrooms"><option>No preference</option><option>1</option><option>2</option><option>3+</option></select></div>
<div class="field"><label>Preferred move-in date</label><input name="moveDate" type="date"></div>
<div class="field full"><label>Any specific requirements?</label><textarea name="requirements" placeholder="Gated community, lift, ground floor, near school/office, water supply, budget for advance, etc."></textarea></div>
<div class="field full"><label class="checkbox-line"><input type="checkbox" name="consent" required> I agree to be contacted about my property enquiry.</label></div>
</div><button class="primary" type="submit">Submit house requirement</button><p class="muted small">Need help? Call <a href="tel:9962666063">9962666063</a>.</p></form></div>`}
function submitRequirement(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));f.consent=!!f.consent;db.requirements.unshift({id:'r'+Date.now(),...f,status:'New',created:new Date().toISOString()});save();toast('Your requirements have been submitted');e.target.reset();if(db.currentUser?.role==='admin')go('requirements');else go('home')}
function loginPage(){return `<div class="panel login-box"><h2>Admin login</h2><p class="muted">Sign in to manage properties, enquiries and visit requests.</p><form onsubmit="login(event)"><div class="field"><label>Username</label><input name="username" required autocomplete="username"></div><div class="field"><label>Password</label><input name="password" type="password" required autocomplete="current-password"></div><button class="primary" type="submit">Sign in</button></form><div class="notice"><b>Demo credentials</b><br>Username: admin<br>Password: admin123<br><span class="small">Change these in the HTML before using the site publicly.</span></div></div>`}
function login(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(f.username===ADMIN_USER&&f.password===ADMIN_PASS){db.currentUser={role:'admin',name:'Admin'};save();toast('Welcome, admin');go('admin')}else toast('Incorrect username or password')}
function logout(){db.currentUser=null;save();go('home');toast('Logged out')}
function adminPage(){if(db.currentUser?.role!=='admin')return loginPage();return `<div class="section-head"><div><h2>Admin dashboard</h2><p class="muted">Manage listings and customer activity. Data is saved in this browser.</p></div><button class="primary" onclick="propertyForm()">+ Add property</button></div><div class="stats"><div class="stat">Total properties<strong>${db.properties.length}</strong></div><div class="stat">Available<strong>${db.properties.filter(p=>p.available==='Available').length}</strong></div><div class="stat">Enquiries<strong>${db.requirements.length}</strong></div><div class="stat">Visit requests<strong>${db.bookings.length}</strong></div></div><div class="panel"><h3>Quick actions</h3><div class="card-actions"><button class="primary" onclick="propertyForm()">Add property</button><button class="secondary" onclick="go('requirements')">View enquiries</button><button class="secondary" onclick="go('mybookings')">Manage visits</button><button class="secondary" onclick="exportData()">Export all data (JSON)</button><button class="danger" onclick="resetDemo()">Reset demo data</button></div></div><div class="panel"><h3>Recent enquiries</h3>${db.requirements.length?`<div class="table-wrap"><table><thead><tr><th>Name</th><th>Phone</th><th>House / Budget</th><th>Location</th><th>Status</th></tr></thead><tbody>${db.requirements.slice(0,5).map(r=>`<tr><td>${esc(r.name)}</td><td><a href="tel:${esc(r.phone)}">${esc(r.phone)}</a></td><td>${esc(r.houseType)}<br>${esc(r.budget)}</td><td>${esc(r.location)}</td><td><span class="status">${esc(r.status)}</span></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">No enquiries yet.</p>'}</div>`}
function propertyForm(id=''){if(db.currentUser?.role!=='admin'){toast('Admin login required');return}const p=db.properties.find(x=>x.id===id)||{title:'',type:'2 BHK',kind:'Rent',price:'',advance:'',location:'',address:'',furnishing:'Semi-furnished',parking:'No preference',pets:'No preference',available:'Available',beds:'',baths:'',area:'',description:'',amenities:'',image:''};editingId=id||null;document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h2>${id?'Edit property':'Add property'}</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveProperty(event)"><div class="form-grid">
<div class="field full"><label>Property title *</label><input name="title" value="${esc(p.title)}" required></div>
<div class="field"><label>House type *</label><select name="type">${['1 RK/Studio','1 BHK','2 BHK','3 BHK','4 BHK+'].map(x=>`<option ${p.type===x?'selected':''}>${x}</option>`).join('')}</select></div>
<div class="field"><label>Listing type</label><select name="kind"><option ${p.kind==='Rent'?'selected':''}>Rent</option><option ${p.kind==='Sale'?'selected':''}>Sale</option></select></div>
<div class="field"><label>${p.kind==='Sale'?'Sale price (₹)':'Monthly rent (₹)'} *</label><input name="price" type="number" min="0" required value="${esc(p.price)}"></div>
<div class="field"><label>Advance amount (₹)</label><input name="advance" type="number" min="0" value="${esc(p.advance)}"></div>
<div class="field"><label>Location / locality *</label><input name="location" required value="${esc(p.location)}" placeholder="e.g. OMR, Chennai"></div>
<div class="field"><label>Full address</label><input name="address" value="${esc(p.address)}"></div>
<div class="field"><label>Furnishing</label><select name="furnishing">${['Furnished','Semi-furnished','Unfurnished'].map(x=>`<option ${p.furnishing===x?'selected':''}>${x}</option>`).join('')}</select></div>
<div class="field"><label>Parking</label><select name="parking">${['No preference','Not available','Bike only','Car only','Car and bike'].map(x=>`<option ${p.parking===x?'selected':''}>${x}</option>`).join('')}</select></div>
<div class="field"><label>Pets</label><select name="pets">${['No preference','Allowed','Considered','No pets'].map(x=>`<option ${p.pets===x?'selected':''}>${x}</option>`).join('')}</select></div>
<div class="field"><label>Availability status</label><select name="available">${['Available','Reserved','Rented'].map(x=>`<option ${p.available===x?'selected':''}>${x}</option>`).join('')}</select></div>
<div class="field"><label>Bedrooms</label><input name="beds" type="number" min="0" value="${esc(p.beds)}"></div>
<div class="field"><label>Bathrooms</label><input name="baths" type="number" min="0" value="${esc(p.baths)}"></div>
<div class="field"><label>Area (sq.ft)</label><input name="area" type="number" min="0" value="${esc(p.area)}"></div>
<div class="field"><label>Image URL</label><input name="image" type="url" value="${esc(p.image)}" placeholder="https://…"></div>
<div class="field full"><label>Amenities</label><input name="amenities" value="${esc(p.amenities)}" placeholder="Lift, security, balcony, water supply"></div>
<div class="field full"><label>Description</label><textarea name="description">${esc(p.description)}</textarea></div>
</div><button class="primary" type="submit">Save property</button></form></div></div>`}
function saveProperty(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));f.price=Number(f.price);f.advance=Number(f.advance||0);['beds','baths','area'].forEach(k=>f[k]=Number(f[k]||0));if(editingId){db.properties=db.properties.map(p=>p.id===editingId?{...p,...f}:p)}else db.properties.unshift({id:'p'+Date.now(),...f});save();closeModal();toast('Property saved');render()}
function deleteProperty(id){if(!confirm('Delete this property listing?'))return;db.properties=db.properties.filter(p=>p.id!==id);save();render();toast('Property deleted')}
function cycleStatus(id){const p=db.properties.find(x=>x.id===id);if(!p)return;const vals=['Available','Reserved','Rented'];p.available=vals[(vals.indexOf(p.available)+1)%vals.length];save();render();toast('Property status updated')}
function bookingsPage(){const admin=db.currentUser?.role==='admin';const list=db.bookings.filter(b=>admin||b.phone===db.currentUser?.phone);return `<div class="section-head"><div><h2>${admin?'Visit booking management':'My visit requests'}</h2><p class="muted">${admin?'Review and update requested property visits.':'Your visit requests are shown in this browser.'}</p></div></div>${list.length?`<div class="panel table-wrap"><table><thead><tr><th>Customer</th><th>Property</th><th>Visit date/time</th><th>Contact / Message</th><th>Status</th>${admin?'<th>Update</th>':''}</tr></thead><tbody>${list.map(b=>`<tr><td>${esc(b.name)}</td><td>${esc(b.propertyTitle)}</td><td>${esc(b.date)}<br>${esc(b.time)}</td><td><a href="tel:${esc(b.phone)}">${esc(b.phone)}</a><br>${esc(b.message||'—')}</td><td><span class="status ${esc(b.status)}">${esc(b.status)}</span></td>${admin?`<td><select onchange="updateBooking('${b.id}',this.value)">${['Pending','Approved','Reschedule requested','Completed','Cancelled'].map(s=>`<option ${b.status===s?'selected':''}>${s}</option>`).join('')}</select></td>`:''}</tr>`).join('')}</tbody></table></div>`:'<div class="empty">No visit requests yet. Browse properties and book a visit to get started.</div>'}<div class="notice">For help or confirmation, call <a href="tel:9962666063">9962666063</a>.</div>`}
function updateBooking(id,status){const b=db.bookings.find(x=>x.id===id);if(b){b.status=status;save();toast('Booking status updated');render()}}
function enquiriesPage(){return ''}
function requirementAdminList(){if(db.currentUser?.role!=='admin')return `<div class="notice">Submit a requirement or <button class="secondary" onclick="go('login')">sign in as admin</button> to review enquiries.</div>`;return db.requirements.length?`<div class="panel table-wrap"><table><thead><tr><th>Customer</th><th>House needs</th><th>Move-in</th><th>Preferences</th><th>Status</th><th>Update</th></tr></thead><tbody>${db.requirements.map(r=>`<tr><td><b>${esc(r.name)}</b><br><a href="tel:${esc(r.phone)}">${esc(r.phone)}</a><br><span class="small">${new Date(r.created).toLocaleDateString()}</span></td><td>${esc(r.staying)} · ${esc(r.occupants)} occupant(s)<br>${esc(r.houseType)} · ${esc(r.budget)}<br>${esc(r.kind||'Rent')}</td><td>${esc(r.timeline)}<br>${esc(r.moveDate||'No date')}</td><td>${esc(r.location)}<br>Parking: ${esc(r.parking)}<br>Furnishing: ${esc(r.furnishing)}<br>Pets: ${esc(r.pets)}<br>${esc(r.requirements||'')}</td><td><span class="status">${esc(r.status)}</span></td><td><select onchange="updateRequirement('${r.id}',this.value)">${['New','Contacted','Matched','Closed'].map(s=>`<option ${r.status===s?'selected':''}>${s}</option>`).join('')}</select><br><button class="danger" style="margin-top:6px" onclick="deleteRequirement('${r.id}')">Delete</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No customer enquiries yet.</div>'}
function updateRequirement(id,status){const r=db.requirements.find(x=>x.id===id);if(r){r.status=status;save();render()}}
function deleteRequirement(id){if(confirm('Delete this enquiry?')){db.requirements=db.requirements.filter(x=>x.id!==id);save();render()}}
const _originalRequirementPage=requirementPage;
requirementPage=function(){if(db.currentUser?.role==='admin')return `<div class="section-head"><div><h2>Customer enquiries</h2><p class="muted">Review customer house requirements and follow up by phone.</p></div><button class="secondary" onclick="exportData()">Export data</button></div>${requirementAdminList()}`;return _originalRequirementPage()}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='omr-estates-backup.json';a.click();URL.revokeObjectURL(url);toast('Backup exported')}
function resetDemo(){if(!confirm('Reset all properties, enquiries and bookings to demo data? This cannot be undone. Export a backup first if needed.'))return;db=structuredClone(defaultData);save();render();toast('Demo data reset')}
render();
</script>
</body>
</html>
